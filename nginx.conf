server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # ==========================================
    # Portal Backend
    # ==========================================
    location /api/v1/ {
        proxy_pass http://portal:8091/api/v1/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ==========================================
    # Schemes Backend
    # ==========================================
    location /api/v1/schemes/ {
        proxy_pass http://schemes:8082/api/v1/schemes/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/master/ {
        proxy_pass http://schemes:8082/api/v1/master/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/reports/ {
        proxy_pass http://schemes:8082/api/v1/reports/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ==========================================
    # RVSK 6A Backend
    # ==========================================
    location /api/v1/attendance/ {
        proxy_pass http://rvsk6a:8083/api/v1/attendance/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/accreditation/ {
        proxy_pass http://rvsk6a:8083/api/v1/accreditation/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ==========================================
    # React SPA
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
